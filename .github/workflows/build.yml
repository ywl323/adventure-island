name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode version
        run: |
          xcodebuild -version
          xcodegen -version

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Build iOS project
        run: |
          xcodebuild -project AdventureIsland.xcodeproj \
            -scheme AdventureIsland \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find built app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdventureIsland.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_ENV

      - name: Create output directory
        run: mkdir -p output

      - name: Export IPA
        run: |
          if [ -n "${{ env.app_path }}" ]; then
            cd "${{ env.app_path }}/.."
            zip -r ../output/AdventureIsland.ipa AdventureIsland.app
            echo "IPA created successfully"
          else
            echo "No app found - build may have failed"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AdventureIsland-IPA
          path: output/AdventureIsland.ipa
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "- status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- runner: macOS 14" >> $GITHUB_STEP_SUMMARY
