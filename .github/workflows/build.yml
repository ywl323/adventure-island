name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xcodegen (2.1.0)
        run: npm install -g xcodegen@2.1.0

      - name: Generate Xcode project
        run: |
          export PATH="$(npm global bin):$PATH"
          xcodegen generate

      - name: Show COMPLETE pbxproj content around buildPhases
        run: |
          python3 << 'PYEOF'
          import re
          
          with open('AdventureIsland.xcodeproj/project.pbxproj', 'r') as f:
            content = f.read()
          
          # Find PBXNativeTarget section
          match = re.search(r'isa = PBXNativeTarget;[\s\S]*?buildPhases = \([\s\S]*?\);', content)
          if match:
            print("=== PBXNativeTarget buildPhases ===")
            print(match.group(0))
          
          # Find all PBXBuildPhase sections
          phase_pattern = r'(\t[0-9A-F]{24} \) = \{\n\t\tisa = PBXBuildPhase;[\s\S]*?\n\t\};)'
          for m in re.finditer(phase_pattern, content):
            block = m.group(0)
            # Extract name
            name_match = re.search(r'name = ([^;]+);', block)
            name = name_match.group(1) if name_match else 'NO NAME'
            files_match = re.search(r'files = \(([\s\S]*?)\);', block)
            files = files_match.group(1) if files_match else ''
            print(f"\nPhase: {name}")
            print(f"Files: {files[:200] if files else 'empty'}")
          
          PYEOF

      - name: Build iOS project
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/AdventureIsland-*
          xcodebuild -project AdventureIsland.xcodeproj \
            -target AdventureIsland \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=17.4' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdventureIsland.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Export IPA
        if: success()
        run: |
          if [ -n "${{ env.APP_PATH }}" ]; then
            mkdir -p output
            cd "${{ env.APP_PATH }}"
            zip -r ../output/AdventureIsland.ipa AdventureIsland.app
            echo "IPA created"
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdventureIsland-IPA
          path: output/AdventureIsland.ipa
          retention-days: 7