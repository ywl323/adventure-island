name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install xcodegen
        run: npm install -g xcodegen@2.1.0

      - name: Generate project
        run: |
          export PATH="$(npm global bin):$PATH"
          xcodegen generate

      - name: Build
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/AdventureIsland-*
          xcodebuild -project AdventureIsland.xcodeproj -scheme AdventureIsland -configuration Debug -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=17.4' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Find app
        id: find-app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdventureIsland.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Export IPA
        if: success()
        run: |
          mkdir -p output
          cp -R "${{ env.APP_PATH }}" output/
          cd output
          zip -r AdventureIsland.ipa AdventureIsland.app

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdventureIsland-IPA
          path: output/AdventureIsland.ipa
          retention-days: 7