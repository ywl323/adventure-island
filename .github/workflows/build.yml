name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xcodegen (2.1.0)
        run: npm install -g xcodegen@2.1.0

      - name: Generate Xcode project
        run: |
          export PATH="$(npm global bin):$PATH"
          xcodegen generate

      - name: Fix duplicate outputs using Python
        run: |
          python3 << 'PYEOF'
          import re
          
          with open('AdventureIsland.xcodeproj/project.pbxproj', 'r') as f:
            content = f.read()
          
          # Find all PBXBuildPhase blocks (sections starting with a 24-char hex ID in parentheses)
          # Pattern: (ID) = { ... isa = PBXBuildPhase; ... }
          block_pattern = r'(\t[0-9A-F]{24} \) = \{[\s\S]*?\n\t\};)'
          
          def should_remove_block(block):
            # Check if this is a build phase with CreateDirectory output for .app
            if 'isa = PBXBuildPhase;' in block:
              if 'name = CreateDirectory;' in block:
                # Check if output files contain .app
                output_match = re.search(r'outputFiles = \([\s\S]*?\);', block)
                if output_match and '.app' in output_match.group():
                  return True
            return False
          
          # Split content into blocks and process
          result_blocks = []
          for match in re.finditer(block_pattern, content):
            block = match.group(0)
            if should_remove_block(block):
              print(f"Removing block: {block[:80]}...")
              continue
            result_blocks.append(block)
          
          # Reconstruct
          new_content = re.sub(block_pattern, lambda m: result_blocks.pop(0) if result_blocks and should_remove_block(m.group(0)) == False else '', content)
          
          # Simpler approach: just remove any line or block with CreateDirectory + .app
          lines = content.split('\n')
          new_lines = []
          skip_block = False
          block_lines = []
          block_start = None
          
          for i, line in enumerate(lines):
            if re.match(r'\t[0-9A-F]{24} \) = \{', line):
              block_start = line
              block_lines = [line]
              skip_block = False
            elif block_lines:
              block_lines.append(line)
              if line.strip() == '};':
                # End of block - check if should skip
                block_text = '\n'.join(block_lines)
                if 'isa = PBXBuildPhase;' in block_text and 'name = CreateDirectory;' in block_text and '.app' in block_text:
                  print(f"SKIP block with CreateDirectory + .app")
                  skip_block = True
                if not skip_block:
                  new_lines.extend(block_lines)
                block_lines = []
                block_start = None
            else:
              new_lines.append(line)
          
          with open('AdventureIsland.xcodeproj/project.pbxproj', 'w') as f:
            f.write('\n'.join(new_lines))
          
          print("Done fixing pbxproj")
          
          # Verify
          with open('AdventureIsland.xcodeproj/project.pbxproj', 'r') as f:
            verify = f.read()
          create_count = verify.count('CreateDirectory')
          print(f"CreateDirectory entries remaining: {create_count}")
          
          PYEOF

      - name: Build iOS project
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/AdventureIsland-*
          xcodebuild -project AdventureIsland.xcodeproj \
            -scheme AdventureIsland \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=17.4' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdventureIsland.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Export IPA
        if: success()
        run: |
          if [ -n "${{ env.APP_PATH }}" ]; then
            mkdir -p output
            cd "${{ env.APP_PATH }}"
            zip -r ../output/AdventureIsland.ipa AdventureIsland.app
            echo "IPA created"
          else
            echo "Build may have failed"
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdventureIsland-IPA
          path: output/AdventureIsland.ipa
          retention-days: 7