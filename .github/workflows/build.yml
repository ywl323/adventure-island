name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xcodegen
        run: npm install -g xcodegen@2.1.0

      - name: Check tools
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List project files
        run: ls -la

      - name: Build iOS project
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/AdventureIsland-*
          xcodebuild -project AdventureIsland.xcodeproj \
            -scheme AdventureIsland \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M4),OS=17.4' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdventureIsland.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Export IPA
        run: |
          if [ -n "${{ env.APP_PATH }}" ]; then
            mkdir -p output
            cd "${{ env.APP_PATH }}"
            zip -r ../output/AdventureIsland.ipa AdventureIsland.app
            echo "IPA created"
          else
            echo "Build may have failed"
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdventureIsland-IPA
          path: output/AdventureIsland.ipa
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "- status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- runner: macOS 14" >> $GITHUB_STEP_SUMMARY