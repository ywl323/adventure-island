name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xcodegen (2.1.0)
        run: npm install -g xcodegen@2.1.0

      - name: Generate Xcode project
        run: |
          export PATH="$(npm global bin):$PATH"
          xcodegen generate

      - name: Fix pbxproj with detailed diagnostics
        run: |
          python3 << 'PYEOF'
          import re
          
          with open('AdventureIsland.xcodeproj/project.pbxproj', 'r') as f:
            content = f.read()
          
          print(f"Original file size: {len(content)}")
          print(f"Original CreateDirectory count: {content.count('CreateDirectory')}")
          
          # Find all CreateDirectory-related blocks
          lines = content.split('\n')
          new_lines = []
          i = 0
          removed_count = 0
          
          while i < len(lines):
            line = lines[i]
            # Check if this line starts a block (24-char hex ID in parens followed by = {)
            match = re.match(r'^([\t][0-9A-F]{24} \) = \{)$', line)
            if match:
              # Collect the full block until we hit };
              block_start = i
              block = [line]
              i += 1
              while i < len(lines) and lines[i].strip() != '};':
                block.append(lines[i])
                i += 1
              if i < len(lines):
                block.append(lines[i])  # The };
              
              block_text = '\n'.join(block)
              
              # Check if this is the problematic CreateDirectory block
              if 'isa = PBXBuildPhase;' in block_text and 'name = CreateDirectory;' in block_text:
                # Check for .app in outputFiles
                if 'outputFiles' in block_text and '.app' in block_text:
                  print(f"REMOVING problematic block at line {block_start}:")
                  print(f"  First 100 chars: {block_text[:100]}...")
                  removed_count += 1
                  # Skip this block
                  i += 1
                  continue
            
              new_lines.extend(block)
              i += 1
            else:
              new_lines.append(line)
              i += 1
          
          new_content = '\n'.join(new_lines)
          print(f"Removed {removed_count} blocks")
          print(f"New file size: {len(new_content)}")
          print(f"Remaining CreateDirectory: {new_content.count('CreateDirectory')}")
          
          with open('AdventureIsland.xcodeproj/project.pbxproj', 'w') as f:
            f.write(new_content)
          
          print("pbxproj fixed successfully")
          
          PYEOF

      - name: Build iOS project
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/AdventureIsland-*
          xcodebuild -project AdventureIsland.xcodeproj \
            -scheme AdventureIsland \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=17.4' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdventureIsland.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Export IPA
        if: success()
        run: |
          if [ -n "${{ env.APP_PATH }}" ]; then
            mkdir -p output
            cd "${{ env.APP_PATH }}"
            zip -r ../output/AdventureIsland.ipa AdventureIsland.app
            echo "IPA created"
          else
            echo "Build may have failed"
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdventureIsland-IPA
          path: output/AdventureIsland.ipa
          retention-days: 7