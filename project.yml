name: AdventureIsland
options:
  bundleIdPrefix: com.dev
  deploymentTarget:
    iOS: "15.0"
  compatibilityVersion: "Xcode 13.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"

targets:
  AdventureIsland:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "15.0"
    sources:
      - path: AdventureIsland
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.adventureisland
        INFOPLIST_FILE: AdventureIsland/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_BITCODE: "NO"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    info:
      path: AdventureIsland/Info.plist
      properties:
        CFBundleName: AdventureIsland
        CFBundleDisplayName: Adventure Island
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false